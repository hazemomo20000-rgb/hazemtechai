name: Build HazemTech AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor wrapper for the published website
        run: |
          mkdir -p android-apk/www
          cd android-apk
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8
          npm install --save-dev @capacitor/cli@^8
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.hazemtech.ai",
            "appName": "HazemTech AI",
            "webDir": "www",
            "server": {
              "url": "https://hazemtechai.lovable.app",
              "cleartext": false
            },
            "android": {
              "backgroundColor": "#071B1C"
            }
          }
          EOF
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#071B1C">
            <title>HazemTech AI</title>
          </head>
          <body>
            <p>تعذر تحميل HazemTech AI. تحقق من اتصال الإنترنت ثم أعد فتح التطبيق.</p>
          </body>
          </html>
          EOF
          npx cap add android

      - name: Build debug APK
        working-directory: android-apk/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HazemTech-AI-debug-apk
          path: android-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
